<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', -apple-system, sans-serif; margin: 0; padding: 5px; background-color: #f8f9fa; user-select: none; }
        #canvas-container { width: 100%; text-align: center; background: #ffffff; border-radius: 12px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        canvas { border: 3px solid #343a40; background: #ffffff; border-radius: 8px; cursor: pointer; max-width: 100%; height: auto; display: block; margin: 0 auto; }
        .guide-banner { background: #e7f5ff; border: 1px solid #a5d8ff; padding: 8px 12px; border-radius: 6px; font-size: 13px; color: #1864ab; font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .status-bar { margin-top: 8px; padding: 8px 12px; background: #212529; color: #f8f9fa; border-radius: 6px; font-weight: bold; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .btn-toggle { background: #4c6ef5; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-toggle:hover { background: #3b5bdb; }
        .badge { background-color: #d4edda; color: #155724; padding: 2px 8px; border-radius: 12px; font-size: 11px; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
<div id="canvas-container">
    <div class="guide-banner">
        <div>💡 <b>내벽</b> 드래그 방크기 | <b>가구/카페트/액자/소품</b> 이동 | <b>'R'+휠</b> 회전</div>
        <div>
            <button id="toggleLabelsBtn" class="btn-toggle" onclick="toggleLabels()">🏷️ 가구 이름: ON</button>
            <span class="badge" style="margin-left: 6px;">⚡ 3D 동기화</span>
        </div>
    </div>
    <canvas id="floorCanvas" width="880" height="560"></canvas>
    <div class="status-bar">
        <span id="statusText">🎮 마우스로 가구, 카페트, 소품, 액자를 자유롭게 이동해보세요!</span>
    </div>
</div>

<script>
    let houseW = 10.0;
    let houseL = 8.0;
    let walls = { y_mid: 4.4, x_mid1: 5.0, x_mid2: 3.8, x_mid3: 7.5, y_bath: 6.4 };
    let showLabels = true;

    // 초기 기본 가구 데이터 세팅 (통신 지연 시에도 즉시 출력)
    let items = [
        {"id": "carpet_living", "name": "거실 카페트", "type": "carpet", "x": 0.5, "y": 0.5, "w": 3.0, "l": 2.2, "h": 0.02, "z_base": 0.02, "rot": 0.0, "color": "#CBD5E1"},
        {"id": "sofa", "name": "거실 소파", "type": "furniture", "x": 0.8, "y": 0.8, "w": 2.4, "l": 1.2, "h": 0.9, "z_base": 0.05, "rot": 0.0, "color": "#EF4444"},
        {"id": "tv", "name": "TV장", "type": "furniture", "x": 0.8, "y": 2.8, "w": 1.8, "l": 0.6, "h": 0.6, "z_base": 0.05, "rot": 0.0, "color": "#3B82F6"},
        {"id": "bed", "name": "안방 침대", "type": "furniture", "x": 5.5, "y": 0.8, "w": 2.0, "l": 2.0, "h": 1.1, "z_base": 0.05, "rot": 0.0, "color": "#A855F7"},
        {"id": "table", "name": "주방 식탁", "type": "furniture", "x": 4.2, "y": 4.8, "w": 1.8, "l": 1.1, "h": 0.8, "z_base": 0.05, "rot": 0.0, "color": "#F59E0B"},
        {"id": "fridge", "name": "냉장고", "type": "furniture", "x": 7.8, "y": 4.6, "w": 1.0, "l": 1.0, "h": 1.8, "z_base": 0.05, "rot": 0.0, "color": "#10B981"},
        {"id": "desk", "name": "작은방 책상", "type": "furniture", "x": 0.8, "y": 4.8, "w": 1.4, "l": 0.9, "h": 0.75, "z_base": 0.05, "rot": 0.0, "color": "#14B8A6"},
        {"id": "laptop", "name": "노트북(책상위)", "type": "on_top", "x": 1.2, "y": 5.0, "w": 0.5, "l": 0.4, "h": 0.2, "z_base": 0.80, "rot": 0.0, "color": "#334155"},
        {"id": "frame", "name": "벽면 액자", "type": "wall_art", "x": 2.0, "y": 0.05, "w": 1.2, "l": 0.15, "h": 0.8, "z_base": 1.40, "rot": 0.0, "color": "#F59E0B"}
    ];

    const canvas = document.getElementById('floorCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');

    const scale = 72;
    const originX = 50;
    const originY = 40;

    let selectedItem = null;
    let activeWall = null;
    let isDragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let isRPressed = false;
    let rotTimer = null;

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }

    function toggleLabels() {
        showLabels = !showLabels;
        document.getElementById('toggleLabelsBtn').innerText = showLabels ? "🏷️ 가구 이름: ON" : "🏷️ 가구 이름: OFF";
        draw();
    }

    function sendToStreamlit() {
        const itemStates = items.map(it => ({
            id: it.id || it.name,
            name: it.name,
            type: it.type || "furniture",
            x: parseFloat(it.x.toFixed(2)),
            y: parseFloat(it.y.toFixed(2)),
            w: parseFloat((it.w || 1.0).toFixed(2)),
            l: parseFloat((it.l || 1.0).toFixed(2)),
            h: parseFloat((it.h || 0.8).toFixed(2)),
            z_base: parseFloat((it.z_base || 0.05).toFixed(2)),
            rot: it.rot || 0,
            color: it.color || "#4D96FF"
        }));
        
        const wData = {
            y_mid: parseFloat(walls.y_mid.toFixed(2)),
            x_mid1: parseFloat(walls.x_mid1.toFixed(2)),
            x_mid2: parseFloat(walls.x_mid2.toFixed(2)),
            x_mid3: parseFloat(walls.x_mid3.toFixed(2)),
            y_bath: parseFloat(walls.y_bath.toFixed(2))
        };

        window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setComponentValue",
            value: {
                walls: wData,
                items: itemStates,
                show_labels: showLabels,
                timestamp: Date.now()
            }
        }, "*");
    }

    function onRenderData(args) {
        if (!args) return;
        houseW = args.house_w || 10.0;
        houseL = args.house_l || 8.0;
        
        if (args.walls) walls = Object.assign({}, args.walls);
        if (args.items && args.items.length > 0 && !isDragging) {
            items = JSON.parse(JSON.stringify(args.items));
        }
        if (args.show_labels !== undefined) {
            showLabels = args.show_labels;
            document.getElementById('toggleLabelsBtn').innerText = showLabels ? "🏷️ 가구 이름: ON" : "🏷️ 가구 이름: OFF";
        }
        draw();
    }

    // 통신 메시지 수신기 (호환성 개선)
    window.addEventListener("message", function(event) {
        if (!event.data) return;
        let data = event.data;
        if (data.type === "streamlit:render") {
            onRenderData(data.args);
        } else if (data.detail && data.detail.type === "streamlit:render") {
            onRenderData(data.detail.args);
        }
    });

    // ready & height 알림
    window.parent.postMessage({isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1}, "*");
    window.parent.postMessage({isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: 680}, "*");

    function getRooms() {
        return [
            { name: "거실", x: 0, y: 0, w: walls.x_mid1, l: walls.y_mid, color: "#FAFAFA" },
            { name: "안방", x: walls.x_mid1, y: 0, w: houseW - walls.x_mid1, l: walls.y_mid, color: "#F3E5F5" },
            { name: "작은방", x: 0, y: walls.y_mid, w: walls.x_mid2, l: houseL - walls.y_mid, color: "#E1F5FE" },
            { name: "주방/식당", x: walls.x_mid2, y: walls.y_mid, w: Math.max(0.1, walls.x_mid3 - walls.x_mid2), l: houseL - walls.y_mid, color: "#FFF3E0" },
            { name: "욕실/화장실", x: walls.x_mid3, y: walls.y_mid, w: houseW - walls.x_mid3, l: Math.max(0.1, walls.y_bath - walls.y_mid), color: "#E0F7FA" },
            { name: "현관", x: walls.x_mid3, y: walls.y_bath, w: houseW - walls.x_mid3, l: houseL - walls.y_bath, color: "#E8EAF6" }
        ];
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 방 구역
        getRooms().forEach(r => {
            let rx = originX + r.x * scale;
            let ry = originY + r.y * scale;
            ctx.fillStyle = r.color;
            ctx.fillRect(rx, ry, r.w * scale, r.l * scale);
            ctx.strokeStyle = "#adb5bd";
            ctx.lineWidth = 1;
            ctx.strokeRect(rx, ry, r.w * scale, r.l * scale);
            ctx.fillStyle = "#495057";
            ctx.font = "bold 13px sans-serif";
            ctx.fillText(r.name, rx + 8, ry + 20);
        });

        // 2. 외벽 및 내벽
        ctx.strokeStyle = "#212529";
        ctx.lineWidth = 6;
        ctx.strokeRect(originX, originY, houseW * scale, houseL * scale);

        drawWallLine("y_mid", originX, originY + walls.y_mid * scale, originX + houseW * scale, originY + walls.y_mid * scale);
        drawWallLine("x_mid1", originX + walls.x_mid1 * scale, originY, originX + walls.x_mid1 * scale, originY + walls.y_mid * scale);
        drawWallLine("x_mid2", originX + walls.x_mid2 * scale, originY + walls.y_mid * scale, originX + walls.x_mid2 * scale, originY + houseL * scale);
        drawWallLine("x_mid3", originX + walls.x_mid3 * scale, originY + walls.y_mid * scale, originX + walls.x_mid3 * scale, originY + houseL * scale);
        drawWallLine("y_bath", originX + walls.x_mid3 * scale, originY + walls.y_bath * scale, originX + houseW * scale, originY + houseL * scale);

        // 3. 다층 가구 항목 렌더링
        const renderOrder = { "carpet": 1, "furniture": 2, "on_top": 3, "wall_art": 3 };
        let sortedItems = [...items].sort((a, b) => (renderOrder[a.type] || 2) - (renderOrder[b.type] || 2));

        sortedItems.forEach(item => {
            let iw = (item.w || 1.0) * scale;
            let il = (item.l || 1.0) * scale;
            let cx = originX + (item.x + (item.w || 1.0) / 2) * scale;
            let cy = originY + (item.y + (item.l || 1.0) / 2) * scale;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate((item.rot || 0) * Math.PI / 180);

            if (item === selectedItem) {
                ctx.fillStyle = "rgba(255, 193, 7, 0.45)";
                ctx.fillRect(-iw/2 - 4, -il/2 - 4, iw + 8, il + 8);
                ctx.strokeStyle = "#d39e00";
                ctx.lineWidth = 3;
                ctx.strokeRect(-iw/2 - 4, -il/2 - 4, iw + 8, il + 8);
            }

            if (item.type === 'carpet') {
                ctx.fillStyle = item.color || "#CBD5E1";
                ctx.fillRect(-iw/2, -il/2, iw, il);
                ctx.strokeStyle = "#64748B";
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 4]);
                ctx.strokeRect(-iw/2, -il/2, iw, il);
                ctx.setLineDash([]);
            } else if (item.type === 'wall_art') {
                ctx.fillStyle = item.color || "#F59E0B";
                ctx.fillRect(-iw/2, -il/2, iw, il);
                ctx.strokeStyle = "#B45309";
                ctx.lineWidth = 3;
                ctx.strokeRect(-iw/2, -il/2, iw, il);
            } else if (item.type === 'on_top') {
                ctx.fillStyle = item.color || "#334155";
                ctx.fillRect(-iw/2, -il/2, iw, il);
                ctx.strokeStyle = "#0F172A";
                ctx.lineWidth = 2;
                ctx.strokeRect(-iw/2, -il/2, iw, il);
            } else {
                ctx.fillStyle = item.color || "#4D96FF";
                ctx.fillRect(-iw/2, -il/2, iw, il);
                ctx.strokeStyle = "#1E293B";
                ctx.lineWidth = 2;
                ctx.strokeRect(-iw/2, -il/2, iw, il);
            }

            if (showLabels) {
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowColor = "rgba(0,0,0,0.85)";
                ctx.shadowBlur = 4;
                ctx.fillText((item.name || "").substring(0, 10), 0, 0);
                ctx.shadowBlur = 0;
            }

            ctx.restore();
        });
    }

    function drawWallLine(wallKey, x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = (activeWall === wallKey) ? 7 : 5;
        ctx.strokeStyle = (activeWall === wallKey) ? "#e63946" : "#495057";
        ctx.stroke();

        let midX = (x1 + x2) / 2;
        let midY = (y1 + y2) / 2;
        ctx.fillStyle = (activeWall === wallKey) ? "#e63946" : "#212529";
        ctx.beginPath();
        ctx.arc(midX, midY, 6, 0, Math.PI * 2);
        ctx.fill();
    }

    function checkWallHover(mx, my) {
        const tolerance = 8;
        let y_mid_px = originY + walls.y_mid * scale;
        if (Math.abs(my - y_mid_px) <= tolerance && mx >= originX && mx <= originX + houseW * scale) return 'y_mid';

        let x_mid1_px = originX + walls.x_mid1 * scale;
        if (Math.abs(mx - x_mid1_px) <= tolerance && my >= originY && my <= originY + walls.y_mid * scale) return 'x_mid1';

        let x_mid2_px = originX + walls.x_mid2 * scale;
        if (Math.abs(mx - x_mid2_px) <= tolerance && my >= originY + walls.y_mid * scale && my <= originY + houseL * scale) return 'x_mid2';

        let x_mid3_px = originX + walls.x_mid3 * scale;
        if (Math.abs(mx - x_mid3_px) <= tolerance && my >= originY + walls.y_mid * scale && my <= originY + houseL * scale) return 'x_mid3';

        let y_bath_px = originY + walls.y_bath * scale;
        if (Math.abs(my - y_bath_px) <= tolerance && mx >= originX + walls.x_mid3 * scale && mx <= originX + houseW * scale) return 'y_bath';

        return null;
    }

    canvas.addEventListener('mousedown', (e) => {
        const pos = getMousePos(e);
        const mx = pos.x;
        const my = pos.y;

        let hoveredWall = checkWallHover(mx, my);
        if (hoveredWall) {
            activeWall = hoveredWall;
            isDragging = true;
            selectedItem = null;
            statusText.innerHTML = "🧱 내벽 조절 중: <b>" + activeWall + "</b>";
            draw();
            return;
        }

        const renderOrder = { "carpet": 1, "furniture": 2, "on_top": 3, "wall_art": 3 };
        let sortedItems = [...items].sort((a, b) => (renderOrder[b.type] || 2) - (renderOrder[a.type] || 2));

        for (let i = 0; i < sortedItems.length; i++) {
            let item = sortedItems[i];
            let iw = (item.w || 1.0) * scale;
            let il = (item.l || 1.0) * scale;
            let ix = originX + item.x * scale;
            let iy = originY + item.y * scale;

            if (mx >= ix && mx <= ix + iw && my >= iy && my <= iy + il) {
                selectedItem = item;
                activeWall = null;
                isDragging = true;
                dragOffsetX = mx - ix;
                dragOffsetY = my - iy;
                statusText.innerHTML = "🎯 선택 항목: <b>" + item.name + "</b> (타입: " + item.type + ")";
                draw();
                return;
            }
        }

        selectedItem = null;
        activeWall = null;
        statusText.innerHTML = "🎮 마우스로 가구, 카페트, 소품, 액자를 자유롭게 이동해보세요!";
        draw();
    });

    canvas.addEventListener('mousemove', (e) => {
        const pos = getMousePos(e);
        const mx = pos.x;
        const my = pos.y;

        if (!isDragging) {
            let hoveredWall = checkWallHover(mx, my);
            canvas.style.cursor = hoveredWall ? (hoveredWall.startsWith('y') ? 'ns-resize' : 'ew-resize') : 'pointer';
            return;
        }

        if (activeWall) {
            let mValX = (mx - originX) / scale;
            let mValY = (my - originY) / scale;

            if (activeWall === 'y_mid') walls.y_mid = Math.max(1.5, Math.min(houseL - 1.5, mValY));
            else if (activeWall === 'x_mid1') walls.x_mid1 = Math.max(1.0, Math.min(houseW - 1.0, mValX));
            else if (activeWall === 'x_mid2') walls.x_mid2 = Math.max(0.8, Math.min(walls.x_mid3 - 0.5, mValX));
            else if (activeWall === 'x_mid3') walls.x_mid3 = Math.max(walls.x_mid2 + 0.5, Math.min(houseW - 0.8, mValX));
            else if (activeWall === 'y_bath') walls.y_bath = Math.max(walls.y_mid + 0.5, Math.min(houseL - 0.5, mValY));

            draw();
            return;
        }

        if (selectedItem) {
            let itemW = selectedItem.w || 1.0;
            let itemL = selectedItem.l || 1.0;
            selectedItem.x = Math.max(0, Math.min(houseW - itemW, (mx - dragOffsetX - originX) / scale));
            selectedItem.y = Math.max(0, Math.min(houseL - itemL, (my - dragOffsetY - originY) / scale));
            draw();
        }
    });

    window.addEventListener('mouseup', () => {
        if (isDragging) {
            isDragging = false;
            sendToStreamlit();
        }
    });

    window.addEventListener('keydown', (e) => { if (e.key === 'r' || e.key === 'R') isRPressed = true; });
    window.addEventListener('keyup', (e) => { if (e.key === 'r' || e.key === 'R') isRPressed = false; });

    canvas.addEventListener('wheel', (e) => {
        if (selectedItem && isRPressed) {
            e.preventDefault();
            selectedItem.rot = ((selectedItem.rot || 0) + (e.deltaY < 0 ? 5 : -5) + 360) % 360;
            draw();
            clearTimeout(rotTimer);
            rotTimer = setTimeout(sendToStreamlit, 300);
        }
    }, { passive: false });

    // 초판 즉시 렌더링
    draw();
</script>
</body>
</html>
